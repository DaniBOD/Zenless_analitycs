[project]
name = "danibod-zzz-analytics"
version = "0.1.0"
description = "ZZZ disc scoring, capture and optimization for DaniBOD"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "mss>=9.0",
    "opencv-python>=4.10",
    "pytesseract>=0.3.13",
    "pynput>=1.7",
    "pywin32>=308",
    "anthropic>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "pytest-benchmark",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["app/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
