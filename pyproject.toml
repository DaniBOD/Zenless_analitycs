[project]
name = "danibod-zzz-analytics"
version = "0.1.0"
description = "ZZZ disc scoring, capture and optimization for DaniBOD"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "mss>=9.0",
    "opencv-python>=4.10",
    # El MOTOR del OCR (Fase 2E): mismos pesos que paddle, 40 % más rápido con la máquina
    # ocupada. OJO al instalar: `pip install onnxruntime` a secas quiere subir protobuf a
    # 4.x/7.x y paddlepaddle 2.6.2 está en 3.20.2 — va con `--no-deps`. Verificado que corre
    # con protobuf 3.20.2 (lo que necesita viaja en la DLL nativa).
    "onnxruntime>=1.20",
    "pytesseract>=0.3.13",
    "pywin32>=308",
    "anthropic>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "pytest-benchmark",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["app/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
