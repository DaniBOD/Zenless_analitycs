# rois.toml — Regiones de interés para captura OCR
# Coordenadas normalizadas 0.0-1.0 relativas al tamaño de la ventana del juego.
# Calibradas sobre screenshots reales en Documentacion/Screenshots_Triggers/Discos_Triggers/
# Resolución de referencia: 16:9 (verificadas en 2560x1440 y 1920x1080).
#
# Formato: [x, y, w, h] normalizados (0.0-1.0)
# x,y = esquina superior izquierda; w,h = ancho/alto de la región
#
# IMPORTANTE: cada estado (S3, S6, S7, S10) tiene layout distinto.
# Validar con tools/annotate_rois.py tras cualquier cambio.
#
# Substats: el juego los muestra en grilla 2 columnas × 2 filas (max 4).
# Numeración:  sub1=fila1col1  sub2=fila1col2  sub3=fila2col1  sub4=fila2col2

# ===========================================================================
# S3 — Modal de detalle de drop (desde pantalla de Resultado de Desafío)
# ===========================================================================
# Layout: modal centrado, ocupa ~40% del ancho de pantalla en x≈[0.30, 0.70].
# Stats panel a la izquierda dentro del modal, imagen del disco a la derecha.
# Discos recién dropeados (nivel 0) tienen 3 substats; nivel >=3 tienen 4.
[modal_detalle_s3]
# Coords RECALIBRADAS 2026-05-11 vía OCR inverso (tools/calibrate_rois_from_ocr.py)
# sobre Ejemplo_1.png (2559x1439). Cobertura validada del texto real.

titulo            = [0.325, 0.225, 0.220, 0.040]  # "Fábula Yunkui (1)" en y_norm=0.229
nivel             = [0.325, 0.268, 0.110, 0.025]  # "Nivel 00/15" en y=0.272
rareza_borde      = [0.620, 0.300, 0.040, 0.040]  # borde superior del icono del disco

# Mainstat — columna izquierda del bloque (mismo X que substats)
main_stat_nombre  = [0.330, 0.432, 0.130, 0.025]  # "PV" en x=0.336, y=0.436
main_stat_valor   = [0.460, 0.432, 0.110, 0.025]  # "550" en x=0.466, y=0.436

# Substats — grilla 2 cols × 2 filas. Col1 x=0.330, Col2 x=0.510
sub1_nombre       = [0.330, 0.519, 0.150, 0.025]  # fila1 col1 "Ataque" en x=0.336, y=0.524
sub1_valor        = [0.470, 0.519, 0.080, 0.025]  # "19" en x=0.475
sub2_nombre       = [0.510, 0.519, 0.150, 0.025]  # fila1 col2 "Defensa" en x=0.514
sub2_valor        = [0.625, 0.519, 0.080, 0.025]  # "4.8" en x=0.634
sub3_nombre       = [0.330, 0.568, 0.150, 0.025]  # fila2 col1 "Daño Crítico" en x=0.336, y=0.573
sub3_valor        = [0.470, 0.568, 0.080, 0.025]
sub4_nombre       = [0.510, 0.568, 0.150, 0.025]  # fila2 col2
sub4_valor        = [0.625, 0.568, 0.080, 0.025]

# Set bonus block ("Efecto de conjunto" en y=0.621)
efecto_conjunto   = [0.330, 0.660, 0.300, 0.180]


