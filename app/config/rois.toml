# rois.toml — Regiones de interés para captura OCR
# Coordenadas normalizadas 0.0-1.0 relativas al tamaño de la ventana del juego.
# Calibradas sobre screenshots reales en Documentacion/Screenshots_Triggers/Discos_Triggers/
# Resolución de referencia: 16:9 (verificadas en 2560x1440 y 1920x1080).
#
# Formato: [x, y, w, h] normalizados (0.0-1.0)
# x,y = esquina superior izquierda; w,h = ancho/alto de la región
#
# IMPORTANTE: cada estado (S3, S6, S7, S10) tiene layout distinto.
# Validar con tools/annotate_rois.py tras cualquier cambio.
#
# Substats: el juego los muestra en grilla 2 columnas × 2 filas (max 4).
# Numeración:  sub1=fila1col1  sub2=fila1col2  sub3=fila2col1  sub4=fila2col2

# ===========================================================================
# S3 — Modal de detalle de drop (desde pantalla de Resultado de Desafío)
# ===========================================================================
# Layout: modal centrado, ocupa ~40% del ancho de pantalla en x≈[0.30, 0.70].
# Stats panel a la izquierda dentro del modal, imagen del disco a la derecha.
# Discos recién dropeados (nivel 0) tienen 3 substats; nivel >=3 tienen 4.
[modal_detalle_s3]

titulo            = [0.32, 0.180, 0.28, 0.050]   # "Fábula Yunkui (1)"
nivel             = [0.32, 0.235, 0.13, 0.035]   # "Nivel 00/15"
rareza_borde      = [0.62, 0.230, 0.04, 0.030]   # esquina sup-izq de la imagen del disco

# Mainstat (alineado más a la derecha que substats por padding interno)
main_stat_nombre  = [0.555, 0.358, 0.10, 0.035]  # "PV" / "ATK %" / etc
main_stat_valor   = [0.660, 0.358, 0.08, 0.035]  # "550" / "30 %"

# Substats — grilla 2 cols × 2 filas (col1: x=0.42, col2: x=0.61)
sub1_nombre       = [0.420, 0.430, 0.13, 0.030]  # fila1 col1
sub1_valor        = [0.545, 0.430, 0.07, 0.030]
sub2_nombre       = [0.610, 0.430, 0.13, 0.030]  # fila1 col2
sub2_valor        = [0.735, 0.430, 0.07, 0.030]
sub3_nombre       = [0.420, 0.470, 0.13, 0.030]  # fila2 col1
sub3_valor        = [0.545, 0.470, 0.07, 0.030]
sub4_nombre       = [0.610, 0.470, 0.13, 0.030]  # fila2 col2
sub4_valor        = [0.735, 0.470, 0.07, 0.030]

# Set bonus block (texto del efecto de conjunto, para fuzzy match del nombre)
efecto_conjunto   = [0.420, 0.560, 0.30, 0.180]


# ===========================================================================
# S6 — Modal detalle desde Tienda Música (vista panel)
# ===========================================================================
# Layout: pantalla "fullscreen" con imagen del disco grande a la izquierda
# y panel de stats a la derecha (x≈0.50 hasta x≈0.95).
# Header arriba con "Ciudad/Tienda" y monedas; título grande arriba-izquierda.
[modal_detalle_s6]

titulo            = [0.020, 0.115, 0.42, 0.060]  # "Nana a la luz cenicienta (4)"
nivel             = [0.640, 0.135, 0.10, 0.050]  # "Nivel 00/15"
rareza_borde      = [0.200, 0.220, 0.06, 0.040]  # banda superior del disco grande (color identifica rareza)

# Mainstat (panel derecho)
main_stat_nombre  = [0.500, 0.310, 0.20, 0.040]  # "Daño Crítico"
main_stat_valor   = [0.835, 0.310, 0.10, 0.040]  # "12 %"

# Substats — grilla 2 cols × 2 filas (col1: x=0.50, col2: x=0.72)
sub1_nombre       = [0.500, 0.420, 0.18, 0.035]
sub1_valor        = [0.665, 0.420, 0.07, 0.035]
sub2_nombre       = [0.720, 0.420, 0.18, 0.035]
sub2_valor        = [0.890, 0.420, 0.07, 0.035]
sub3_nombre       = [0.500, 0.465, 0.18, 0.035]
sub3_valor        = [0.665, 0.465, 0.07, 0.035]
sub4_nombre       = [0.720, 0.465, 0.18, 0.035]
sub4_valor        = [0.890, 0.465, 0.07, 0.035]

efecto_conjunto   = [0.500, 0.585, 0.43, 0.300]


