# ===========================================================================
# S10 — Modal de upgrade (PRE y POST comparten layout)
# ===========================================================================
# Layout: modal centrado más grande que S3 (x≈[0.18, 0.78]).
# Imagen del disco a la izquierda, stats a la derecha, barra EXP abajo, botón "Mejorar" abajo-derecha.
# Distinción PRE/POST: nivel_actual cambia + substats POST muestran "+N" rolls + valor mainstat sube.
[modal_upgrade_s10]

titulo            = [0.205, 0.180, 0.28, 0.050]  # "Fábula Yunkui (1)"
# Nota: en S10 NO hay un campo "Nivel X/15" textual aparte. El nivel se infiere de exp_actual (chip izquierda de abajo).
rareza_borde      = [0.215, 0.270, 0.04, 0.040]

# Mainstat
main_stat_nombre  = [0.500, 0.235, 0.10, 0.035]  # "PV"
main_stat_valor   = [0.610, 0.235, 0.10, 0.035]  # "550" / "2200"

# Substats — grilla 2 cols × 2 filas
# Importante en POST: pueden tener "+N" rolls junto al nombre (ej "Defensa +1")
sub1_nombre       = [0.500, 0.305, 0.13, 0.035]
sub1_valor        = [0.625, 0.305, 0.07, 0.035]
sub2_nombre       = [0.720, 0.305, 0.13, 0.035]
sub2_valor        = [0.840, 0.305, 0.07, 0.035]
sub3_nombre       = [0.500, 0.345, 0.13, 0.035]
sub3_valor        = [0.625, 0.345, 0.07, 0.035]
sub4_nombre       = [0.720, 0.345, 0.13, 0.035]
sub4_valor        = [0.840, 0.345, 0.07, 0.035]

# Barra EXP (3 chips: actual / progreso / total)
exp_actual        = [0.430, 0.435, 0.10, 0.045]  # "0" o "15"
exp_progreso      = [0.530, 0.435, 0.18, 0.045]  # "0/480" o "MAX"
exp_total         = [0.715, 0.435, 0.10, 0.045]  # "0" o "15"

# Botón Mejorar (para detectar habilitado/deshabilitado por color)
